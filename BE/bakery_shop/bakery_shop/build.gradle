plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Starter cơ bản
	implementation 'org.springframework.boot:spring-boot-starter'

	// Web (cho @RestController, @GetMapping, @RequestMapping, …)
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Database (chọn 1 cái, ví dụ H2 để dev/test nhanh)
	runtimeOnly 'com.h2database:h2'
	// runtimeOnly 'mysql:mysql-connector-j' // nếu bạn dùng MySQL

	// Lombok (cho @Data, @NoArgsConstructor, @AllArgsConstructor, @Builder, …)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	// Mongo DB
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	//load env
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
